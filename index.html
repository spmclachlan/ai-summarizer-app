<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steve's AI Literature Summariser (Efficient)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        /* Minimal Custom Styles for Reusability and Specific Overrides */
        body { font-family: 'Inter', sans-serif; }
        
        /* Reusable Input/Button Styling */
        .app-input {
            /* Simulates @apply w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all */
            width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 0.5rem; transition: all;
        }
        .app-button {
            /* Simulates @apply w-full md:w-auto px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors focus:ring-4 focus:ring-blue-300 */
            display: block; width: 100%; padding: 0.75rem 1.5rem; background-color: #2563eb; color: white; border-radius: 0.5rem; transition: background-color;
        }

        /* Exclusion Checkbox Specific Styling */
        .exclusion-checkbox:checked {
            accent-color: #ef4444; /* red-500 */
        }
        
        /* Simple Spinner Animation */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #3b82f6; /* blue-500 */
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
        }
        .chat-spinner {
            width: 20px;
            height: 20px;
            border-width: 2px;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto p-4 md:p-8">
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-gray-800">AI Literature Summariser</h1>
            <p class="text-gray-600">Search PubMed, summarize findings, and translate.</p>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
            <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4">
                <input id="searchInput" type="text" placeholder="Enter your research query (e.g., 'efficacy of CRISPR in DMD')" class="app-input flex-grow">
                <button id="searchButton" class="app-button">Search PubMed</button>
            </div>
        </div>

        <div id="loadingSpinner" class="flex justify-center py-8 hidden">
            <div class="spinner"></div>
        </div>

        <div id="translatedQuerySection" class="bg-yellow-50 p-4 rounded-lg border-l-4 border-yellow-500 mb-6 hidden transition-all">
            <div class="flex justify-between items-center cursor-pointer" onclick="handleTogglePubmedQuery()">
                <p class="font-medium text-sm text-yellow-800">
                    <span id="pubmedQueryToggleText">Show Optimized Search Strategy</span>
                </p>
                <svg id="pubmedQueryToggleIcon" class="w-4 h-4 text-yellow-800 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
            <p id="translatedQueryDisplay" class="mt-2 text-sm text-yellow-700 hidden">
                </p>
        </div>

        <div id="resultsSection" class="hidden">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Summary & Articles</h2>

            <div class="bg-white p-6 rounded-xl shadow-lg mb-6 flex flex-col md:flex-row md:justify-between space-y-4 md:space-y-0 md:space-x-6">
                <div id="summaryTypeContainer" class="flex-grow flex space-x-4">
                    <p class="font-medium text-gray-700 py-2">Summary Type:</p>
                    <div><input type="radio" name="summaryType" id="type_overview" value="overview" checked class="text-blue-600"> <label for="type_overview">Overview</label></div>
                    <div><input type="radio" name="summaryType" id="type_pros_cons" value="pros_cons" class="text-blue-600"> <label for="type_pros_cons">Pros/Cons</label></div>
                </div>
                <div class="flex items-center space-x-2">
                    <label for="languageSelect" class="font-medium text-gray-700">Language:</label>
                    <select id="languageSelect" class="p-2 border rounded-md">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                    </select>
                </div>
            </div>

            <div id="summaryContainer" class="bg-blue-50 p-6 rounded-xl border-l-4 border-blue-600 mb-8 min-h-[100px] relative">
                <p id="summaryDisplay" class="text-gray-800">Your summarized results will appear here.</p>
                <div id="summaryLoadingSpinner" class="hidden absolute inset-0 bg-blue-50/80 flex justify-center items-center">
                    <div class="spinner chat-spinner"></div>
                </div>
            </div>

            <h3 class="text-xl font-semibold text-gray-700 mb-3">Included Articles (<span id="includedCount">0</span>)</h3>
            <div id="articleListContainer" class="space-y-3">
                </div>
        </div>
    </div>

    <script type="module">
        // --- 1. API Configuration ---
        const GEMINI_API_KEY = "AIzaSyAJclRSkKNWVcVCuxZZDFnYAF-VqUqYYAM";
        const NCBI_EUTILS_BASE = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/";
        const GEMINI_MODEL = 'gemini-2.5-flash';

        // --- 2. DOM Element Retrieval Consolidation ---
        const [
            searchInput, searchButton, loadingSpinner, resultsSection, summaryContainer, 
            summaryDisplay, summaryLoadingSpinner, articleListContainer, languageSelect,
            translatedQuerySection, pubmedQueryToggleText, pubmedQueryToggleIcon,
            summaryTypeContainer, includedCountDisplay, translatedQueryDisplay
        ] = [
            'searchInput', 'searchButton', 'loadingSpinner', 'resultsSection', 'summaryContainer', 
            'summaryDisplay', 'summaryLoadingSpinner', 'articleListContainer', 'languageSelect',
            'translatedQuerySection', 'pubmedQueryToggleText', 'pubmedQueryToggleIcon',
            'summaryTypeContainer', 'includedCount', 'translatedQueryDisplay'
        ].map(id => document.getElementById(id));

        // --- 3. State Management ---
        let allArticles = [];
        let includedArticlesForSummary = [];
        let lastEnglishSummary = null;
        let lastSummaryType = 'overview';
        
        // --- 4. API Implementations (REPLACED MOCKS) ---

        /**
         * Uses Gemini to convert natural language into an optimized PubMed query string.
         */
        const translateQuery = async (query) => {
            const prompt = `You are an expert bioinformatician and librarian. Your task is to convert a user's natural language research question into a highly optimized, precise PubMed search query string suitable for use with NCBI E-utilities 'esearch' tool.
            
            Rules:
            1. The output MUST be only the raw search string, with no introduction, explanation, or surrounding characters (e.g., no quotes, no code blocks).
            2. Enclose MeSH terms and specific phrases in double quotes.
            3. Use correct Boolean operators (AND, OR, NOT) in uppercase.
            4. Automatically add the filter '("journal article"[pt] OR "review"[pt]) AND ("pubmed central"[filter] OR "full text"[filter])' to narrow results to high-quality, accessible articles.

            User Query: ${query}`;

            const url = `https://generativelanguage.googleapis.com/v1/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    config: { temperature: 0.1 }
                })
            });

            if (!response.ok) throw new Error("Gemini API failed to translate query.");
            
            const data = await response.json();
            return data.candidates[0].content.parts[0].text.trim();
        };

        /**
         * Uses NCBI E-utilities (ESearch and EFetch) to retrieve articles.
         */
        const searchPubMed = async (pubmedQuery) => {
            // Step 1: ESearch to get PMIDs (max 20 articles)
            const esearchUrl = `${NCBI_EUTILS_BASE}esearch.fcgi?db=pubmed&retmode=json&retmax=20&term=${encodeURIComponent(pubmedQuery)}`;
            
            let response = await fetch(esearchUrl);
            if (!response.ok) throw new Error(`ESearch failed: ${response.statusText}`);
            
            const searchData = await response.json();
            const pmids = searchData.esearchresult.idlist;

            if (pmids.length === 0) return [];
            
            // Step 2: EFetch to get article details in JSON format
            const pmidList = pmids.join(',');
            // Note: Use 'pubmed' db for the richer data structure
            const efetchUrl = `${NCBI_EUTILS_BASE}efetch.fcgi?db=pubmed&retmode=json&id=${pmidList}`;

            response = await fetch(efetchUrl);
            if (!response.ok) throw new Error(`EFetch failed: ${response.statusText}`);

            const fetchData = await response.json();
            
            // Step 3: Parse and standardize the articles
            const articles = Object.values(fetchData.result.uids)
                .map(uidData => {
                    // PubMed JSON structure is complex; this simplifies it
                    const authors = (uidData.authors || []).map(a => `${a.lastname} ${a.initials}`).join(', ');
                    
                    return {
                        pmid: uidData.uid,
                        title: uidData.title || 'No Title Available',
                        authors: authors || 'Authors Not Listed',
                        pubdate: uidData.pubdate || 'N/A',
                        abstract: uidData.abstracttext ? uidData.abstracttext.join(' ') : 'No abstract available.'
                    };
                })
                .filter(a => a.abstract !== 'No abstract available.'); // Filter out articles with no abstracts

            return articles;
        };

        /**
         * Uses Gemini to synthesize abstracts via a Map-Reduce style prompt.
         */
        const summarizeWithMapReduce = async (articles, summaryType) => {
            if (articles.length === 0) return "No articles were included in the summary.";

            // Format all abstracts into a single string for the prompt
            const abstractsText = articles.map((a, i) => 
                `--- Article ${i + 1} (PMID: ${a.pmid}) ---\nTitle: ${a.title}\nAbstract: ${a.abstract}`
            ).join('\n\n');

            const summaryGoal = summaryType === 'overview' 
                ? "Provide a comprehensive, synthesized overview of the collective findings, identifying key themes and conclusions." 
                : "Analyze the data and structure the summary into clear 'Pros' (supporting evidence, benefits) and 'Cons' (limitations, conflicting data, risks) sections based on the literature.";

            const prompt = `You are a medical researcher. Your task is to perform a Map-Reduce style synthesis of the provided scientific abstracts.

            The final summary MUST be a single, cohesive document that synthesizes the collective findings of all articles, not just a list of individual summaries.

            Summary Goal: ${summaryGoal}

            Source Abstracts (${articles.length} total):
            ---
            ${abstractsText}
            ---

            Instructions:
            1. Read and map key findings from all abstracts.
            2. Reduce the findings into a single, structured summary document.
            3. The summary should be written for a college-educated, non-specialist audience.
            4. **Output format MUST be clean, valid markdown.** Use headings and lists appropriate to the goal (Overview or Pros/Cons).`;

            const url = `https://generativelanguage.googleapis.com/v1/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    config: { temperature: 0.5, systemInstruction: "You are a medical literature synthesis expert." }
                })
            });

            if (!response.ok) throw new Error("Gemini API failed to summarize.");
            
            const data = await response.json();
            return data.candidates[0].content.parts[0].text.trim();
        };

        /**
         * Uses Gemini to translate the final English summary.
         */
        const translateSummary = async (text, lang) => {
            if (lang === 'en') return text;
            
            const languageMap = { 'es': 'Spanish', 'fr': 'French' };
            const targetLang = languageMap[lang] || lang;

            const prompt = `Translate the following scientific summary precisely and fluently into ${targetLang}. Preserve the original markdown formatting (headings, lists, bolding).

            Original Text:
            ---
            ${text}
            ---`;

            const url = `https://generativelanguage.googleapis.com/v1/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    config: { temperature: 0.3 }
                })
            });

            if (!response.ok) throw new Error("Gemini API failed to translate.");
            
            const data = await response.json();
            return data.candidates[0].content.parts[0].text.trim();
        };


        // --- 5. UI Toggles Refactoring ---

        window.handleTogglePubmedQuery = () => {
            const isHidden = translatedQuerySection.classList.toggle('hidden');
            pubmedQueryToggleIcon.classList.toggle('-rotate-180');
            
            // Simplified text toggle using ternary operator
            pubmedQueryToggleText.textContent = isHidden
                ? 'Show Optimized Search Strategy'
                : 'Hide Optimized Search Strategy';
        };

        const setLoading = (isLoading, element, spinner) => {
            element.classList.toggle('hidden', isLoading);
            spinner.classList.toggle('hidden', !isLoading);
        };


        // --- 6. Core Logic Refactoring ---

        const updateUrlState = () => {
            const excludedPmids = allArticles
                .filter(a => !includedArticlesForSummary.some(ia => ia.pmid === a.pmid))
                .map(a => a.pmid);
            
            const params = new URLSearchParams(window.location.search);
            
            if (searchInput.value) {
                params.set('q', searchInput.value);
            }

            if (excludedPmids.length > 0) {
                params.set('excl', excludedPmids.join(','));
            } else {
                params.delete('excl');
            }

            const newUrl = `${window.location.pathname}?${params.toString()}`;
            window.history.pushState({ path: newUrl }, '', newUrl);
        };

        const handleExclusionToggle = async (event) => {
            const checkbox = event.target;
            const pmid = checkbox.dataset.pmid;
            const article = allArticles.find(a => a.pmid === pmid);

            if (checkbox.checked) {
                // The checkbox is checked, meaning the article is EXCLUDED
                includedArticlesForSummary = includedArticlesForSummary.filter(a => a.pmid !== pmid);
            } else {
                // The checkbox is unchecked, meaning the article is INCLUDED
                includedArticlesForSummary.push(article);
            }

            includedCountDisplay.textContent = includedArticlesForSummary.length;
            updateUrlState();
            await handleRegenerateSummary(true); // Force re-summarize on exclusion change
        };

        const handleRegenerateSummary = async (forceSummarize) => {
            setLoading(true, summaryDisplay, summaryLoadingSpinner);
            summaryDisplay.innerHTML = '';
            
            try {
                const currentLang = languageSelect.value;
                const currentSummaryType = document.querySelector('input[name="summaryType"]:checked').value;
                
                // 1. Determine if a new English summary is REQUIRED
                const needsNewSummary = forceSummarize || !lastEnglishSummary || currentLang === 'en' || currentSummaryType !== lastSummaryType;
                let finalSummary = lastEnglishSummary;

                if (needsNewSummary) {
                    lastSummaryType = currentSummaryType;
                    
                    if (includedArticlesForSummary.length === 0) {
                        lastEnglishSummary = "No articles are currently selected for summarization. Please uncheck exclusion boxes in the article list.";
                    } else {
                        lastEnglishSummary = await summarizeWithMapReduce(includedArticlesForSummary, currentSummaryType);
                    }
                    finalSummary = lastEnglishSummary;
                }

                // 2. If the current language is NOT English, translate the latest English summary
                if (currentLang !== 'en' && finalSummary) {
                    finalSummary = await translateSummary(finalSummary, currentLang);
                }

                summaryDisplay.innerHTML = finalSummary;
                
            } catch (error) {
                console.error("Summary/Translation failed:", error);
                summaryDisplay.innerHTML = `<p class="text-red-600">Error: Could not generate summary or translation. (${error.message})</p>`;
            } finally {
                setLoading(false, summaryDisplay, summaryLoadingSpinner);
            }
        };

        const handleSearch = async () => {
            const query = searchInput.value.trim();
            if (!query) return;

            setLoading(true, loadingSpinner, loadingSpinner);
            resultsSection.classList.add('hidden');
            summaryDisplay.innerHTML = 'Your summarized results will appear here.';
            
            try {
                // 1. Get optimized PubMed query
                const optimizedQuery = await translateQuery(query);
                translatedQueryDisplay.textContent = optimizedQuery;
                translatedQuerySection.classList.remove('hidden');

                // 2. Search PubMed
                const articles = await searchPubMed(optimizedQuery);

                if (articles.length === 0) {
                    summaryDisplay.innerHTML = `<p class="text-red-600">No articles with abstracts found for the search query.</p>`;
                    resultsSection.classList.add('hidden');
                    return;
                }

                allArticles = articles;
                includedArticlesForSummary = [...articles]; 
                lastEnglishSummary = null; // Clear previous summary state
                
                // 3. Display results and generate initial summary
                displayArticlesList(articles);
                includedCountDisplay.textContent = articles.length;
                resultsSection.classList.remove('hidden');

                await handleRegenerateSummary(true); // Initial summary
                updateUrlState();
                
            } catch (error) {
                console.error("Search failed:", error);
                summaryDisplay.innerHTML = `<p class="text-red-600">Error: A critical error occurred during the search. Please check your API key and network. (${error.message})</p>`;
            } finally {
                setLoading(false, loadingSpinner, loadingSpinner);
            }
        };

        const displayArticlesList = (articles) => {
            articleListContainer.innerHTML = articles.map(article => {
                const isExcluded = !includedArticlesForSummary.some(a => a.pmid === article.pmid);
                return `
                    <div class="bg-gray-100 p-4 rounded-lg shadow-sm flex justify-between items-start">
                        <div>
                            <h4 class="font-medium text-gray-800">${article.title}</h4>
                            <p class="text-sm text-gray-600">${article.authors} (${article.pubdate})</p>
                        </div>
                        <label class="flex items-center space-x-2 ml-4">
                            <input 
                                type="checkbox" 
                                class="exclusion-checkbox form-checkbox h-5 w-5 border-gray-300 rounded text-red-600"
                                data-pmid="${article.pmid}"
                                ${isExcluded ? 'checked' : ''}
                            >
                            <span class="text-sm text-red-600">Exclude</span>
                        </label>
                    </div>
                `;
            }).join('');
        };


        // --- 7. Event Listener Setup (Delegation) ---

        // Main search button
        searchButton.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        // Event Delegation for Exclusions (handles dynamically loaded checkboxes)
        articleListContainer.addEventListener('change', (e) => {
            if (e.target.classList.contains('exclusion-checkbox')) {
                handleExclusionToggle(e);
            }
        });

        // Event Delegation for Summary Type radio buttons
        summaryTypeContainer.addEventListener('change', (e) => {
            if (e.target.name === 'summaryType') {
                handleRegenerateSummary(true); // Force re-summarize when type changes
            }
        });

        // Language change handler
        languageSelect.addEventListener('change', () => handleRegenerateSummary(false));


        // --- 8. Initial Load (Simplified) ---
        const loadStateFromUrl = () => {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q');
            
            if (query) {
                searchInput.value = query;
                // Simplified: automatically trigger search on load if query is present
                // Note: The logic to reapply exclusions from the URL is complex and
                // omitted here for extreme conciseness, but the 'updateUrlState' still saves them.
                handleSearch(); 
            }
        };
        
        document.addEventListener('DOMContentLoaded', loadStateFromUrl);
    </script>
</body>
</html>
